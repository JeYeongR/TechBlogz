name: Collect feeds

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Call collect endpoint
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/collect" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
